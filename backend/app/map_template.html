<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.18.1/mapbox-gl.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    /* The canvas fills #map and would sit on top of anything inside it. */
    #map { position: absolute; inset: 0; z-index: 0; }
    /* Full-page layer above the canvas. Empty space lets pans and the zoom
       control through; only the controls themselves take clicks. */
    #overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      padding: 12px;
      box-sizing: border-box;
      pointer-events: none;
    }
    #controls-top, #controls-bottom {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: flex-start;
    }
    /* Leave the Mapbox zoom control (top right) clear. */
    #controls-top { margin-right: 52px; }
    #overlay :is(button, a, input, select, textarea, label, .panel) {
      pointer-events: auto;
    }
    #overlay :is(button, select, input, .panel) {
      font: 14px/1.2 system-ui, sans-serif;
      background: #fff;
      color: #111;
      border: 0;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, .35);
    }
    #overlay :is(button, select) { padding: 8px 12px; cursor: pointer; }
    #overlay input { padding: 8px; }
    #overlay .panel { padding: 10px 12px; }
    /* A control added outside the slots still has to beat the canvas. */
    body > :is(button, div, form, nav, section):not(#map):not(#overlay) {
      position: relative;
      z-index: 2;
    }
    #map :is(button, a, input, select, label) {
      position: relative;
      z-index: 5;
      pointer-events: auto;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <!-- Put buttons, selects, and panels in these slots, or call addControl().
       Do not place them inside #map: the canvas covers that div and takes the click. -->
  <div id="overlay">
    <div id="controls-top"></div>
    <div id="controls-bottom"></div>
  </div>
  <script>
    // Do not remove: this is how a broken page reports back to the assistant.
    window.onerror = function (message, source, lineno, colno) {
      try {
        window.parent.postMessage(
          { type: 'html-error', message: String(message) + ' at line ' + lineno + ':' + colno },
          '*'
        );
      } catch (e) { /* no-op */ }
    };
    window.addEventListener('unhandledrejection', function (event) {
      try {
        window.parent.postMessage(
          { type: 'html-error', message: 'Unhandled promise rejection: ' + event.reason },
          '*'
        );
      } catch (e) { /* no-op */ }
    });

    // Leave __MAPBOX_TOKEN__ exactly as written. The server inserts the real token.
    mapboxgl.accessToken = '__MAPBOX_TOKEN__';

    // Do not set `style` -- the default is already configured for this app.
    const map = new mapboxgl.Map({
      container: 'map',
      center: [0, 0],
      zoom: 2,
    });
    map.addControl(new mapboxgl.NavigationControl());

    // Keep controls above the canvas. where is 'top' (default) or 'bottom'.
    function addControl(element, where) {
      const slot = document.getElementById(where === 'bottom' ? 'controls-bottom' : 'controls-top');
      slot.appendChild(element);
      return element;
    }

    map.on('load', () => {
      try {
        // -----------------------------------------------------------------
        // Replace everything below with your real data. Keep everything
        // above (the script tags, error handlers, token, map setup) as-is.
        //
        // Typical Traccar shapes you'll fetch via invoke_api:
        //   GET /devices   -> [{ id, name, status, lastUpdate, ... }]
        //   GET /positions -> [{ deviceId, latitude, longitude, speed,
        //                        course, fixTime, ... }]
        //
        // Build one GeoJSON FeatureCollection per logical group (devices,
        // a route, geofences, ...). geometry.coordinates is
        // [longitude, latitude] -- note the order. Put whatever you want to
        // show in a popup or label into feature.properties.
        //
        // Buttons go through addControl(button) or addControl(button, 'bottom').
        // Do not append them to #map or document.body; the canvas takes those clicks.

        const exampleData = {
          type: 'FeatureCollection',
          features: [
            {
              type: 'Feature',
              geometry: { type: 'Point', coordinates: [0, 0] },
              properties: { name: 'Example device' },
            },
          ],
        };

        map.addSource('example', { type: 'geojson', data: exampleData });

        map.addLayer({
          id: 'example-points',
          type: 'circle',
          source: 'example',
          paint: {
            'circle-radius': 6,
            'circle-color': '#ff0000',
            'circle-stroke-color': '#fff',
            'circle-stroke-width': 1.5,
          },
        });

        // Optional: a popup on click, keyed to the layer above.
        map.on('click', 'example-points', (e) => {
          const feature = e.features[0];
          new mapboxgl.Popup()
            .setLngLat(feature.geometry.coordinates)
            .setHTML(feature.properties.name || '')
            .addTo(map);
        });

        // Fit the map to your data once it's added. Collect every
        // [lng, lat] pair you rendered above into `coords`.
        const coords = exampleData.features
          .filter((f) => f.geometry.type === 'Point')
          .map((f) => f.geometry.coordinates);
        if (coords.length) {
          const bounds = coords.reduce(
            (b, c) => b.extend(c),
            new mapboxgl.LngLatBounds(coords[0], coords[0])
          );
          map.fitBounds(bounds, { padding: 60, maxZoom: 15, duration: 0 });
        }
        // -----------------------------------------------------------------
      } catch (e) {
        window.parent.postMessage({ type: 'html-error', message: 'Map setup failed: ' + e.message }, '*');
      }
    });

    // A rejected token or a failed style does not throw, so window.onerror never
    // sees it. Record it for the screenshot step. Do not postMessage here: that
    // user message lands while the screenshot tool call is still open and drops it.
    // Tile errors after the style has loaded are not a failed page.
    let mapFailed = false;
    map.on('error', (event) => {
      if (typeof map.isStyleLoaded === 'function' && map.isStyleLoaded()) return;
      mapFailed = true;
      window.__SCREENSHOT_READY__ = false;
      const message = (event && event.error && event.error.message) || 'Map error';
      window.__PAGE_ERRORS__ = window.__PAGE_ERRORS__ || [];
      window.__PAGE_ERRORS__.push(message);
      window.__PAGE_FAILED__ = true;
    });
    // A style that does load wins over an error from before it was ready.
    map.on('load', () => {
      mapFailed = false;
      window.__PAGE_FAILED__ = false;
      window.__PAGE_ERRORS__ = [];
    });

    // Do not remove: tells the backend screenshot step rendering has settled.
    // A failed map also goes idle; that must not count as ready.
    map.on('idle', () => { if (!mapFailed) window.__SCREENSHOT_READY__ = true; });
  </script>
</body>
</html>
